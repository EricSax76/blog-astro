name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check & build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro type-check
        run: npm run check

      - name: Build
        # Valores placeholder: el guard de Layout.astro rompe el build si las
        # claves Firebase están vacías. En CI solo se verifica que compila;
        # el build que se despliega se hace con el .env real.
        env:
          PUBLIC_FIREBASE_API_KEY: ci-placeholder
          PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          PUBLIC_FIREBASE_APP_ID: ci-placeholder
          PUBLIC_APPCHECK_SITE_KEY: ci-placeholder
        run: npm run build

      - name: npm audit (prod deps)
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Lint & build (functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high
